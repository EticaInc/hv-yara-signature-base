name: Validate YARA rules

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install YARA-X CLI
        env:
          YARA_X_SHA256: 8a3a706ede8abaffbd899bfb7f009ab650502a834ead790d3596c1e0f56a0180
          YARA_X_URL: https://github.com/VirusTotal/yara-x/releases/download/v1.9.0/yara-x-v1.9.0-x86_64-unknown-linux-gnu.gz
        run: |
          curl --fail --location --silent --show-error \
            "$YARA_X_URL" --output "$RUNNER_TEMP/yara-x.tar.gz"
          echo "$YARA_X_SHA256  $RUNNER_TEMP/yara-x.tar.gz" \
            | sha256sum --check -
          tar --extract --gzip --file "$RUNNER_TEMP/yara-x.tar.gz" \
            --directory "$RUNNER_TEMP"
          chmod 0755 "$RUNNER_TEMP/yr"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate rules
        run: bash scripts/validate-rules.sh

      # Runs before the rule tests: an identifier leak should fail the build even when the
      # rules themselves are correct, and this check needs no engine.
      - name: Check for internal identifiers
        run: python3 scripts/check-identifiers.py

      - name: Run rule tests
        run: bash tests/run-rule-tests.sh
